server {
    listen 80;
    server_name bellezalab.duckdns.org;

    # Giới hạn upload size (ảnh base64 có thể lớn)
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ----------------------------------------------------------------
    # Frontend static files (React build)
    # ----------------------------------------------------------------
    root /var/www/bellezalab;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lâu cho assets có hash trong tên file
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # Backend API - reverse proxy đến Docker container
    # ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout lớn hơn vì AI call có thể lâu
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint (không có /api/ prefix)
    location /healthz {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
